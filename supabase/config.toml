# Supabase CLI configuration. Used by `supabase link`, `supabase db push` and
# `supabase functions deploy`, and for running the stack locally (needs Docker).
# Hosted projects are configured in the Supabase dashboard (see docs/SETUP.md).
project_id = "kinora"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Every function checks the caller itself (signed-out viewers may call `playback`, and
# `mux-webhook` is called by Mux with a signature instead of a Supabase token), so the
# gateway's JWT check is turned off. This also keeps them working with the new
# publishable/secret API keys, which are not JWTs.
[functions.playback]
verify_jwt = false

[functions.upload-url]
verify_jwt = false

[functions.video-status]
verify_jwt = false

[functions.delete-video]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

[functions.mux-webhook]
verify_jwt = false
